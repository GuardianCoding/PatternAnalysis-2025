name: mamba-colour
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # --- Core Python/torch stack ---
  - python=3.9
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.7
  - cudatoolkit=11.7

  # --- Standard scientific stack ---
  - numpy>=1.24,<2.0
  - pillow
  - matplotlib
  - imageio
  - pyyaml
  - tqdm
  - opencv
  - einops>=0.7
  - psutil
  - scikit-image
  - numba
  - kornia
  - albumentations
  - timm
  - packaging
  - setuptools
  - wheel
  - ninja
  - typing_extensions
  - pandas
  - pytest
  - click

  # --- Optional: better logs/CLI feedback ---
  - rich
  - colorlog
  - tabulate

  # --- pip-installed packages ---
  - pip:
      - lpips
      - torchmetrics
      - causal-conv1d==1.0.0
      - mamba-ssm==1.0.1

      - git+https://github.com/csguoh/MambaIR@b40c7787bd9317b6448f1dd020e50df90b5d0855#egg=mambair