name: mamba-color
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - pytorch-cuda=11.8  # adjust to your CUDA
  - cudatoolkit
  - numpy
  - pillow
  - pip
  - matplotlib
  - imageio
  - pyyaml
  - tqdm
  - opencv
  - einops
  - psutil
  - scikit-image
  - numba
  - kornia
  - albumentations
  - timm
  - packaging
  - setuptools
  - wheel
  - ninja
  - typing_extensions
  - pandas
  - pytest
  - click
  - pip:
      - lpips
      - rich
      - colorlog
      - tabulate
      - torchmetrics
