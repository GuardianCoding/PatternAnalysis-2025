# Made with the help of ChatGPT5
name: mamba-colour
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # --- Core environment ---
  - python=3.9
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=11.8        # provides the CUDA runtime

  # --- Scientific / utility stack ---
  - numpy>=1.24,<2.0
  - pillow
  - matplotlib
  - imageio
  - pyyaml
  - tqdm
  - opencv
  - einops>=0.6
  - psutil
  - scikit-image
  - numba
  - kornia
  - albumentations
  - timm==0.9.16             # widely compatible with Torch 2.4
  - packaging
  - setuptools
  - wheel
  - ninja
  - typing_extensions
  - pandas
  - pytest
  - click
  - conda-forge::pycocotools              # COCO API for annotations

  # --- Include pip for post-install ---
  - pip
  - pip:
      - transformers==4.44.2
      - basicsr==1.4.2
      - lpips
      - torchmetrics
      - rich
      - colorlog
      - tabulate
      - gdown
      # Mmba kernels
      - causal-conv1d==1.5.0
      - triton==2.1.0
      - mamba-ssm @ https://github.com/state-spaces/mamba/releases/download/v2.2.6.post3/mamba_ssm-2.2.6.post3+cu11torch2.4cxx11abiFALSE-cp39-cp39-linux_x86_64.whl
