# Made with the help of ChatGPT5
name: mamba-colour
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # --- Core environment ---
  - python=3.9
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.7
  - cudatoolkit=11.7

  # --- Scientific / utility stack ---
  - numpy>=1.24,<2.0
  - pillow
  - matplotlib
  - imageio
  - pyyaml
  - tqdm
  - opencv
  - einops>=0.7
  - psutil
  - scikit-image
  - numba
  - kornia
  - albumentations
  - timm
  - packaging
  - setuptools
  - wheel
  - ninja
  - typing_extensions
  - pandas
  - pytest
  - click

  # --- Include pip for post-install ---
  - pip
  - pip:
      - lpips
      - torchmetrics
      - rich
      - colorlog
      - tabulate
      - gdown
      # Mamba kernels
      - causal-conv1d==1.0.0
      - mamba-ssm==1.0.1