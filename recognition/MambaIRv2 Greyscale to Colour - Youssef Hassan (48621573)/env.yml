name: mamba-colour
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # --- Core environment ---
  - python=3.9
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=11.8
  
  # --- Scientific / utility stack ---
  - numpy=1.26.4
  - pillow
  - matplotlib
  - imageio
  - pyyaml
  - tqdm
  - opencv
  - einops>=0.6
  - psutil
  - scikit-image
  - numba
  - kornia
  - albumentations
  - timm==0.9.16
  - packaging
  - setuptools
  - wheel
  - ninja
  - typing_extensions
  - pandas
  - pytest
  - click
  - conda-forge::pycocotools
  
  # --- Include pip for post-install ---
  - pip
  - pip:
      - transformers==4.44.2
      - basicsr==1.4.2
      - lpips
      - torchmetrics
      - rich
      - colorlog
      - tabulate
      - gdown
      - triton==2.3.0
      # Use ONLY pre-built wheels - do not compile from source
      - https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.4.0/causal_conv1d-1.4.0+cu118torch2.4cxx11abiFALSE-cp39-cp39-linux_x86_64.whl
      - https://github.com/state-spaces/mamba/releases/download/v2.2.2/mamba_ssm-2.2.2+cu118torch2.4cxx11abiFALSE-cp39-cp39-linux_x86_64.whl