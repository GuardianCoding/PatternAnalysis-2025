name: mamba-colour
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # --- Core environment ---
  - python=3.9
  - pytorch=2.4.1
  - torchvision=0.19.1
  - pytorch-cuda=11.8
  
  # --- Scientific / utility stack ---
  - numpy=1.26.4  # Pin specific compatible version
  - pillow
  - matplotlib
  - imageio
  - pyyaml
  - tqdm
  - opencv
  - einops>=0.6
  - psutil
  - scikit-image
  - numba
  - kornia
  - albumentations
  - timm==0.9.16
  - packaging
  - setuptools
  - wheel
  - ninja
  - typing_extensions
  - pandas
  - pytest
  - click
  - conda-forge::pycocotools
  
  # --- Include pip for post-install ---
  - pip
  - pip:
      - transformers==4.44.2
      - basicsr==1.4.2
      - lpips
      - torchmetrics
      - rich
      - colorlog
      - tabulate
      - gdown
      # Mamba Kernels
      # Use pre-built wheels to avoid compilation issues
      - causal-conv1d==1.4.0  # More compatible version
      - triton==2.1.0
      - mamba-ssm==2.2.2  # Use version that doesn't require CUDA 11.8+